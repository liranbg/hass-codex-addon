name: Update Codex CLI version

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-codex
  cancel-in-progress: false

jobs:
  update-codex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Get current and latest Codex versions
        id: versions
        run: |
          # Extract current version spec from Dockerfile
          current=$(grep -oP '@openai/codex@\K[^\s"]+' codex/Dockerfile)
          echo "current=$current" >> "$GITHUB_OUTPUT"

          # Fetch latest version from npm
          latest=$(npm view @openai/codex version)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          echo "Current: $current"
          echo "Latest:  $latest"

      - name: Prepare Codex and add-on release update
        id: update
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: python3 scripts/release.py update --codex-version "$LATEST" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "deps: bump @openai/codex to ${{ steps.versions.outputs.latest }}"
          branch: auto/update-codex
          title: "deps: bump @openai/codex to ${{ steps.versions.outputs.latest }}"
          token: ${{ secrets.CODEX_UPDATE_TOKEN }}
          body: |
            Updates the Codex CLI pin, advances the add-on patch release in
            `codex/VERSION`, and records the change in `codex/CHANGELOG.md`.
            Merging this PR triggers validation and stable image publishing.
            Home Assistant metadata advances only after both images are available.

            **Previous:** `${{ steps.versions.outputs.current }}`
            **Updated:** `${{ steps.versions.outputs.latest }}`

            [npm package](https://www.npmjs.com/package/@openai/codex)
          labels: dependencies
          delete-branch: true
