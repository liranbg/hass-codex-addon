name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/liranbg/hass-codex-addon

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      pending: ${{ steps.release.outputs.pending }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Read intended release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "A newer main commit will handle the release."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/release.py check >> "$GITHUB_OUTPUT"
          version=$(cat codex/VERSION)
          tag_sha=$(git ls-remote origin "refs/tags/v$version" | cut -f1)
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            published=$(python3 scripts/release.py check | sed -n 's/pending=//p')
            if [ "$published" = true ]; then
              echo "Version $version already belongs to another commit. Bump codex/VERSION and its changelog."
              exit 1
            fi
          fi

  validate:
    needs: [prepare]
    if: needs.prepare.outputs.pending == 'true'
    uses: ./.github/workflows/ci.yaml

  build-and-push:
    needs: [prepare, validate]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base image
        id: base
        run: |
          image=$(python3 -c "import yaml; print(yaml.safe_load(open('codex/build.yaml'))['build_from']['${{ matrix.arch }}'])")
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: codex
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.IMAGE }}/${{ matrix.arch }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}/${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [prepare, build-and-push]
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check main has not changed during publication
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced during publication; the newer main run will handle the release."
            exit 1
          fi

      - name: Create GitHub release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/release.py notes > /tmp/release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "$VERSION" --notes-file /tmp/release-notes.md
          fi

      - name: Stage Home Assistant metadata for checks
        id: publication
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/release.py promote
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex/config.yaml
          git commit -m "release: advertise add-on $VERSION"
          branch="auto/publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CI on the exact publication commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publication.outputs.branch }}
          PUBLICATION_SHA: ${{ steps.publication.outputs.sha }}
        run: |
          # Explicit dispatch starts CI even though GITHUB_TOKEN pushed the branch.
          gh workflow run ci.yaml --ref "$BRANCH"
          run_id=""
          for _attempt in $(seq 1 60); do
            run_id=$(gh run list --workflow ci.yaml --event workflow_dispatch \
              --branch "$BRANCH" --limit 20 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$PUBLICATION_SHA\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "CI dispatch did not produce a run for $PUBLICATION_SHA."
            exit 1
          fi
          gh run watch "$run_id" --interval 10 --exit-status

      - name: Publish checked metadata to Home Assistant
        env:
          PUBLICATION_SHA: ${{ steps.publication.outputs.sha }}
          BRANCH: ${{ steps.publication.outputs.branch }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced during CI; refusing to advertise stale images."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$PUBLICATION_SHA"
          # A normal fast-forward push preserves the commit that passed CI.
          git push origin "$PUBLICATION_SHA:refs/heads/main"
          git push origin --delete "$BRANCH"
