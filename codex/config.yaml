---
name: OpenAI Codex (Terminal)
slug: oai_codex_terminal
description: "OpenAI Codex CLI interface"
url: "https://github.com/liranbg/hass-codex-addon"
# Release automation sets this and image only after publishing both architectures.
# The intended next release is recorded in VERSION.
version: "0.1.0"
image: "ghcr.io/liranbg/hass-codex-addon/{arch}"
startup: services
init: false
arch:
  - amd64
  - aarch64

# Web UI access URL
webui: http://[HOST]:[PORT:8000]/

# UI
ingress: true
ingress_port: 8000
ingress_stream: true
panel_icon: mdi:console
panel_title: OpenAI Codex

# Networking
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: The webserver port (Not used for Ingress)

# Storage
map:
  - type: share
    read_only: False
  - type: homeassistant_config
    read_only: False
    path: /config

options:
  openai_api_key: ""
  model: ""
  resume_last_session: false
  font_size: 18
  working_directory: "/config"
  review_approvals: regular
  allow_internet_access: false

schema:
  openai_api_key: password
  model: str?
  resume_last_session: bool?
  font_size: "int(10,40)?"
  working_directory: str?
  review_approvals: "list(regular|approve)?"
  allow_internet_access: bool?

backup_exclude:
  - "*.log"

# Allow the add-on to access the Home Assistant API
hassio_api: true
homeassistant_api: true
hassio_role: manager
auth_api: true
